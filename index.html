.banner{background:var(--soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}

.body{margin:0;text-align:center}

.hd h2{margin:4px 2px 0}.hd .sub{margin:2px 2px 10px}

/* stats */
.hd{padding:6px 4px 2px}.hd h2{font-size:36px;margin:0}.hd .sub{margin:2px 0 0;font-size:16px}
.next{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 12px 12px 18px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.next span{display:block;font-size:12px;color:var(--muted)}.next b{font:500 17px var(--disp)}
.cta{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:11px 20px;font:600 15px var(--sans);min-height:44px}
.tiles{gap:10px;margin:0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:none}
.tile span{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.tile b{display:block;font:500 34px/1.15 var(--disp);margin-top:4px;letter-spacing:-.02em}
.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.heatgrid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.cell{border-radius:4px;background:var(--idle)}
.cell.l1{background:color-mix(in srgb,var(--clay) 28%,var(--idle))}.cell.l2{background:color-mix(in srgb,var(--clay) 52%,var(--idle))}.cell.l3{background:color-mix(in srgb,var(--clay) 76%,var(--idle))}.cell.l4{background:var(--clay)}
.cell.fut{background:transparent}.cell.today{outline:2px solid var(--ink);outline-offset:-1px}
.scale{justify-content:flex-end;font-size:12.5px;gap:6px}.scale .cell{width:13px;aspect-ratio:1;display:inline-block}
.grad{height:8px;border-radius:4px}.grad.rec{background:linear-gradient(90deg,var(--clay),var(--sand),var(--sage))}.grad.vol{background:linear-gradient(90deg,var(--idle),var(--clay))}
.idl i{background:var(--idle);border-radius:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:2px}.cal b{font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.cd{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:12px;background:var(--idle);font-style:normal;font-size:14px;color:var(--muted)}
.cd small{position:absolute;bottom:2px;font-size:10px;opacity:.9}.cd.fut{background:transparent}.cd.today{outline:2px solid var(--ink);outline-offset:-1px}
.cd.l1{background:color-mix(in srgb,var(--clay) 28%,var(--idle));color:var(--ink)}.cd.l2{background:color-mix(in srgb,var(--clay) 52%,var(--idle));color:var(--ink)}.cd.l3{background:color-mix(in srgb,var(--clay) 76%,var(--idle));color:#fff}.cd.l4{background:var(--clay);color:#fff}
.actsum{margin:10px 0 0;font-size:14px}
.bodies{margin-top:4px}.body svg{width:100%;max-width:210px;height:auto;display:block;margin:0 auto}.body figcaption{text-align:center;font-size:12px;color:var(--muted)}
.sil polygon{fill:var(--body);stroke:var(--body);stroke-width:3.2;stroke-linejoin:round}.nm polygon{fill:var(--body)}
.mus polygon{stroke:var(--surface);stroke-width:.5;stroke-linejoin:round}.mus.sel polygon{stroke:var(--ink);stroke-width:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.mchip{border:0;border-radius:999px;padding:7px 13px;font-size:14px;background:var(--soft);color:var(--accent);min-height:34px}
.wh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}.wh .sec{margin:0;flex:1}.tgt{font-size:13px;color:var(--muted)}.lnk{border:0;background:none;color:var(--accent);font-weight:600;font-size:15px;min-height:36px;padding:0 2px}
.wchart{width:100%;display:block;font-size:10px;fill:var(--muted)}.wchart .gl{stroke:var(--line);stroke-dasharray:2 3}.wchart .tl{stroke:var(--clay);stroke-width:1.5;stroke-dasharray:5 4}.wchart .tt{fill:var(--clay);font-weight:600}
.wchart .wl{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.wchart .wd{fill:var(--ink)}
.xprog{display:grid;gap:10px}.prow{display:grid;grid-template-columns:1fr 60px 52px;gap:10px;align-items:center;font-size:15px}.prow svg{width:60px;height:18px}.prow path{fill:none;stroke:var(--clay);stroke-width:1.8;stroke-linecap:round}.prow em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}.prow em.up{color:var(--good)}.prow em.dn{color:var(--bad)}
.rbtn{padding:12px 14px}.rbtn b{font-weight:600}
.dd{padding:0}.dd summary{list-style:none;cursor:pointer;padding:16px 18px;font:500 13px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.dd summary::-webkit-details-marker{display:none}.dd summary::after{content:"+";font-size:20px;letter-spacing:0}.dd[open] summary::after{content:"–"}.dd>div,.dd>p{margin:0 18px 18px}
.tab>.card,.tab>.tiles{margin-bottom:0}
.fx{position:relative;aspect-ratio:1/1;width:100%;max-width:300px;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--inset)}
.fx img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fx img+img{opacity:0;animation:fx 2.8s ease-in-out infinite}
@keyframes fx{0%,8%{opacity:0}42%,58%{opacity:1}92%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fx img+img{animation:none}.fx.end img+img{opacity:1}}
@media (max-width:420px){.exbody{grid-template-columns:1fr}}
@media (min-width:421px){.exbody{grid-template-columns:minmax(150px,210px) 1fr}}
.credit a{color:inherit}.credit{font-size:12.5px;text-align:center;margin:6px 0 0}
.fx.static img{position:absolute;inset:0}
.alts{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.alts summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px;font:600 15px var(--sans);color:var(--accent)}
.alts summary::-webkit-details-marker{display:none}.alts summary::after{content:"+";font-size:20px}.alts[open] summary::after{content:"–"}
.alist{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.alt{display:grid;grid-template-columns:84px 1fr;gap:6px 12px;align-items:start;background:var(--inset);border-radius:16px;padding:10px}
.alt.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.alt img{width:84px;height:84px;border-radius:12px;object-fit:cover;grid-row:span 2}
.alt .ai p{margin:2px 0 0;font-size:14px}.alt .ai b{font-weight:600}
.alt .btn.mini{grid-column:2;justify-self:start;min-height:38px;padding:8px 16px;font-size:14px}
.alt .btn:not(.primary){background:var(--surface)}
#sync{background:none;border:0;font:500 12px var(--sans);color:var(--muted);text-align:right;max-width:62%;line-height:1.3;padding:8px 0 8px 8px;min-height:44px;cursor:pointer}
#sync[data-s="error"]{color:var(--bad)}
dialog#settings{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:20px;width:min(92vw,420px);max-height:88vh;overflow:auto;font:400 15px/1.45 var(--sans)}
dialog#settings::backdrop{background:rgba(0,0,0,.45)}
#settings h2{font:500 22px var(--serif,Georgia,serif);margin:0 0 4px}#settings h3{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
#settings label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
#settings input[type=text],#settings input[type=password]{width:100%;box-sizing:border-box;font:16px var(--sans);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--inset);color:var(--ink)}
#settings .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#settings .btn{min-height:44px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--sans)}
#settings .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#settings .fileb{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}#settings .fileb input{display:none}
#set-status,#set-msg,#set-build{font-size:13px;color:var(--muted);margin:6px 0 0}
.coachnote{border-left:3px solid var(--accent)}.coachnote p{margin:6px 0 0;white-space:pre-line}

/* ---------- themes: html[data-scheme] light|dark|black, [data-accent], [data-contrast] ---------- */
html[data-scheme="light"]{--bg:#faf9f5;--surface:#fff;--inset:#f3f1ea;--ink:#141413;--muted:#6b6a64;--line:#e6e3d8;--accent:#c4573a;--accent-ink:#fff;--soft:#f6e6de;--good:#5f8a63;--warn:#a8741a;--bad:#b5412f;--body:#ebe8dd;--idle:#e4e1d6;--clay:#c96442;--sand:#e3b99a;--sage:#8fb08f;--fig:#141413;--eq:#c4573a;--shadow:none;color-scheme:light}
html[data-scheme="dark"]{--bg:#262624;--surface:#30302e;--inset:#262624;--ink:#faf9f5;--muted:#a9a79d;--line:#444440;--accent:#d97757;--accent-ink:#1f1e1d;--soft:#4a362d;--good:#8db48d;--warn:#e0a653;--bad:#e5786a;--body:#3a3936;--idle:#454440;--clay:#d97757;--sand:#b98c6b;--sage:#7fa27f;--fig:#faf9f5;--eq:#d97757;color-scheme:dark}
html[data-scheme="black"]{--bg:#262624;--surface:#30302e;--inset:#262624;--ink:#faf9f5;--muted:#a9a79d;--line:#444440;--accent:#d97757;--accent-ink:#1f1e1d;--soft:#4a362d;--good:#8db48d;--warn:#e0a653;--bad:#e5786a;--body:#3a3936;--idle:#454440;--clay:#d97757;--sand:#b98c6b;--sage:#7fa27f;--fig:#faf9f5;--eq:#d97757;color-scheme:dark--bg:#000;--surface:#0f0f0f;--inset:#181818;--line:#2c2c2c;--body:#1b1b1b;--idle:#262626}
html[data-accent="clay"][data-scheme="light"]{--acc:#c4573a;--acc-clay:#c96442;--acc-soft:#f6e6de}
html[data-accent="clay"][data-scheme="dark"],html[data-accent="clay"][data-scheme="black"]{--acc:#d97757;--acc-clay:#d97757;--acc-soft:#4a362d}
html[data-accent="ocean"][data-scheme="light"]{--acc:#2a68a8;--acc-clay:#3b79ba;--acc-soft:#e0ebf7}
html[data-accent="ocean"][data-scheme="dark"],html[data-accent="ocean"][data-scheme="black"]{--acc:#6fa8e0;--acc-clay:#6fa8e0;--acc-soft:#22384d}
html[data-accent="forest"][data-scheme="light"]{--acc:#2c7048;--acc-clay:#2f6b4c;--acc-soft:#dfeee4}
html[data-accent="forest"][data-scheme="dark"],html[data-accent="forest"][data-scheme="black"]{--acc:#6fbf8c;--acc-clay:#4f9a6e;--acc-soft:#223a2b}
html[data-accent="violet"][data-scheme="light"]{--acc:#6a4cb0;--acc-clay:#7757c2;--acc-soft:#ebe5f7}
html[data-accent="violet"][data-scheme="dark"],html[data-accent="violet"][data-scheme="black"]{--acc:#a68be3;--acc-clay:#a68be3;--acc-soft:#352c50}
html[data-accent="graphite"][data-scheme="light"]{--acc:#3b3a37;--acc-clay:#5a5852;--acc-soft:#e8e6df}
html[data-accent="graphite"][data-scheme="dark"],html[data-accent="graphite"][data-scheme="black"]{--acc:#d9d6cd;--acc-clay:#bdb9ae;--acc-soft:#3b3a37}
html[data-accent]{--accent:var(--acc);--clay:var(--acc-clay);--soft:var(--acc-soft);--eq:var(--acc)}
html[data-contrast="high"][data-scheme="light"]{--bg:#fff;--surface:#fff;--inset:#ecebe4;--ink:#000;--muted:#2b2a26;--line:#5e5c53;--good:#2f6a35;--warn:#7a4f00;--bad:#9a2412;--accent:color-mix(in srgb,var(--acc) 62%,#000)}
html[data-contrast="high"][data-scheme="dark"]{--bg:#161615;--surface:#1f1f1e;--inset:#121211;--ink:#fff;--muted:#dedcd3;--line:#a8a69b;--good:#a6d6a6;--warn:#ffc766;--bad:#ff9d8f;--accent:color-mix(in srgb,var(--acc) 62%,#fff)}
html[data-contrast="high"][data-scheme="black"]{--bg:#000;--surface:#000;--inset:#0b0b0b;--ink:#fff;--muted:#e2e0d7;--line:#b3b1a6;--good:#a6d6a6;--warn:#ffc766;--bad:#ff9d8f;--accent:color-mix(in srgb,var(--acc) 62%,#fff)}
html[data-contrast="high"] .card,html[data-contrast="high"] .tile,html[data-contrast="high"] .next{border-width:2px;border-color:var(--line)}
html[data-contrast="high"] .sub,html[data-contrast="high"] .meta,html[data-contrast="high"] .hist{color:var(--muted)}
html[data-contrast="high"] .btn,html[data-contrast="high"] input[type=text],html[data-contrast="high"] textarea{border:2px solid var(--line)}
/* appearance controls in Settings */
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative;cursor:pointer}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.sw span{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:10px;color:var(--muted);margin-top:6px;white-space:nowrap}
.swrow{padding-bottom:20px}
#settings .seg{display:flex}#settings .seg button{flex:1;min-height:44px;border:0;background:none;font:500 14px var(--sans);color:var(--ink);border-radius:999px}
#settings .seg button.on{background:var(--accent);color:var(--accent-ink)}
#settings .seg{background:var(--inset);border-radius:999px;padding:3px}
.hcrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-top:12px}
.hcrow input{width:26px;height:26px;accent-color:var(--accent)}
#gear{flex:none;width:44px;height:44px;margin:-8px -12px -8px 0;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink);border-radius:50%;cursor:pointer}
#gear:active{background:var(--inset)}
header .in h1{flex:none;white-space:nowrap}header .in #sync{flex:1 1 auto;min-width:0;text-align:right}
</style>
</head>
<body>
<header><div class="in"><h1>Five-Day Split</h1><button id="sync" type="button" data-s="warn">Starting…</button><button id="gear" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg></button></div></header>
<dialog id="settings"><h2>Settings</h2><p id="set-status"></p>
<h3>Cloud sync</h3><p class="sub" style="margin:0;font-size:13px;color:var(--muted)">Your workouts always save on this phone first. Sync copies them to your private GitHub repo so Claude can read them.</p>
<label for="set-repo">Private repo (owner/name)</label><input id="set-repo" type="text" placeholder="your-name/your-private-repo" autocapitalize="off" autocorrect="off" spellcheck="false">
<label for="set-token">Access token</label><input id="set-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="row"><button class="btn primary" id="set-save" type="button">Save &amp; test</button><button class="btn" id="set-now" type="button">Sync now</button><button class="btn" id="set-off" type="button">Turn off</button></div>
<h3>Appearance</h3>
<label>Mode</label><div class="seg" id="th-mode" role="group" aria-label="Mode"><button type="button" data-mode="auto">Auto</button><button type="button" data-mode="light">Light</button><button type="button" data-mode="dark">Dark</button><button type="button" data-mode="black">Black</button></div>
<label>Accent colour</label><div class="swatches swrow" id="th-acc" role="group" aria-label="Accent colour">
<button type="button" class="sw" data-acc="clay" aria-label="Clay" style="background:#c4573a"><span>Clay</span></button>
<button type="button" class="sw" data-acc="ocean" aria-label="Ocean" style="background:#2a68a8"><span>Ocean</span></button>
<button type="button" class="sw" data-acc="forest" aria-label="Forest" style="background:#2c7048"><span>Forest</span></button>
<button type="button" class="sw" data-acc="violet" aria-label="Violet" style="background:#6a4cb0"><span>Violet</span></button>
<button type="button" class="sw" data-acc="graphite" aria-label="Graphite" style="background:#3b3a37"><span>Graphite</span></button></div>
<label class="hcrow" for="th-hc"><span>High contrast (easier to read in bright light)</span><input type="checkbox" id="th-hc"></label>
<h3>Goal</h3><label for="set-target">Target body weight, kg (stays on this phone)</label><input id="set-target" type="text" inputmode="decimal" placeholder="optional">
<h3>Backup</h3><div class="row"><button class="btn" id="set-export" type="button">Export backup</button><label class="btn fileb" style="margin:0;color:var(--ink)">Import backup<input id="set-import" type="file" accept="application/json,.json"></label></div>
<p id="set-msg" role="status"></p><p id="set-build"></p>
<div class="row"><button class="btn" id="set-close" type="button">Close</button></div></dialog>
<main>
<div class="tab" id="tab-log"></div>
<div class="tab" id="tab-plan" hidden></div>
<div class="tab" id="tab-stats" hidden></div>
<div class="tab" id="tab-coach" hidden></div>
</main>
<nav class="nav" aria-label="Sections"><div class="w">
<button data-tab="stats" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>Stats</button>
<button data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log</button>
<button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
<button data-tab="coach"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg>Coach</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="split.js?v=2026-11-18.114035"></script>
</body>
</html>
